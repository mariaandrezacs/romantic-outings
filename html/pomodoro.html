<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Juntos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="heart">⏱️</div>
    <h1>Pomodoro Juntos</h1>
    <p class="subtitle">Foca um tempo, depois a gente descansa</p>

    <input type="number" id="minutos" value="25" min="1" max="120">
    <button onclick="iniciar()">Iniciar</button>
    <button class="secondary" onclick="pausar()">Pausar</button>

    <div class="pomodoro-display" id="display">25:00</div>
    <div class="result" id="mensagem"></div>

    <a href="index.html" class="voltar">← Voltar</a>
  </div>

  <script>
    let intervalo;
    let segundosRestantes = 25 * 60;
    let rodando = false;

    function atualizarDisplay() {
      const m = Math.floor(segundosRestantes / 60).toString().padStart(2, '0');
      const s = (segundosRestantes % 60).toString().padStart(2, '0');
      document.getElementById('display').textContent = `${m}:${s}`;
    }

    function iniciar() {
      if (rodando) return;
      const min = parseInt(document.getElementById('minutos').value) || 25;
      segundosRestantes = min * 60;
      rodando = true;
      document.getElementById('mensagem').textContent = 'Vamos focar juntos!';

      intervalo = setInterval(() => {
        segundosRestantes--;
        atualizarDisplay();
        if (segundosRestantes <= 0) {
          clearInterval(intervalo);
          rodando = false;
          document.getElementById('mensagem').textContent = 'Pausa merecida! Foco concluído.';
        }
      }, 1000);
    }

    function pausar() {
      clearInterval(intervalo);
      rodando = false;
      document.getElementById('mensagem').textContent = 'Pausado.';
    }

    atualizarDisplay();
  </script>
</body>
</html>
